name: CI

on:
  pull_request:
    branches:
      - main
      - "dev/**"
  push:
    branches:
      - "dev/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_DENY_VERSION: "0.20.2"
  MSRV: "1.85.0"
  RUST_TOOLCHAIN: "1.97.1"
  # Link fixtures may be skipped on a developer machine without the privilege to create a
  # directory symbolic link, but never here: a skipped test still reports success, so without
  # this the link paths could stop running and no job would notice.
  SKILLMOUNT_REQUIRE_LINKS: "1"

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      package-acceptance: ${{ steps.scope.outputs.package-acceptance }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classify the package-acceptance scope this run requires
        id: scope
        # Only a promotion into main consumes package-channel acceptance evidence before it can
        # merge, and only a dispatch asks for it deliberately. github.base_ref is empty outside
        # pull-request events, so this one expression also excludes every push. Both acceptance
        # jobs and the gate read this single output, so the rule is written exactly once.
        env:
          PACKAGE_ACCEPTANCE: ${{ github.base_ref == 'main' || github.event_name == 'workflow_dispatch' }}
        run: echo "package-acceptance=$PACKAGE_ACCEPTANCE" >> "$GITHUB_OUTPUT"
      - name: Test branch-policy rules
        run: python .github/scripts/test_branch_policy.py
      - name: Test live-smoke harness safeguards
        run: python .github/scripts/test_live_agent_smoke.py
      - name: Test shell-completion harness safeguards
        run: python .github/scripts/test_shell_completion_acceptance.py
      - name: Test release preparation safeguards
        run: python -B .github/scripts/test_release.py
      - name: Test release publication safeguards
        run: python -B .github/scripts/test_release_publish.py
      - name: Test package-channel preflight and generation safeguards
        run: python -B .github/scripts/test_package_channels.py
      - name: Test package-channel publication safeguards
        run: python -B .github/scripts/test_package_publish.py
      - name: Test package-workflow structural policy
        run: python -B .github/scripts/test_package_workflow_policy.py
      - name: Test Homebrew acceptance-harness safeguards
        run: python -B .github/scripts/test_homebrew_acceptance.py
      - name: Test Chocolatey acceptance-harness safeguards
        run: python -B .github/scripts/test_chocolatey_acceptance.py
      - name: Enforce workflow structural policy across the tree
        run: >-
          python -B .github/scripts/package_workflow_policy.py check
          .github/workflows/package.yml
          .github/workflows/release.yml
          .github/workflows/ci.yml
          .github/workflows/live-agent-smoke.yml
      - name: Validate pull-request branch flow
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: >-
          python .github/scripts/branch_policy.py
          "$BASE_REF" "$HEAD_REF" "$BASE_REPOSITORY" "$HEAD_REPOSITORY"
          "$PR_AUTHOR_LOGIN"
      - name: Report non-applicable branch policy
        if: github.event_name != 'pull_request'
        run: echo "Branch policy is not applicable to ${GITHUB_EVENT_NAME} events."

  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets and features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test all features
        run: cargo test --locked --all-features
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
      - name: Check dependency policy
        run: |
          cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
          cargo deny --locked check
      - name: Build with the minimum supported Rust version
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          cargo +"$MSRV" build --locked --all-targets --all-features
      - name: Build release binaries
        run: cargo build --locked --release --bins
      - name: Build release smoke-test agent
        run: cargo build --locked --release --features test-fixtures --bin skillmount-fake-agent
      - name: Run release executable smoke suite
        env:
          SKILLMOUNT_CLI_SMOKE_CODEX_BIN: ${{ github.workspace }}/target/release/skillmount-fake-agent
        run: cargo test --locked --release --test cli_smoke

  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - name: windows-x86
            os: windows-2025
            target: i686-pc-windows-msvc
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust target
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" "${{ matrix.target }}"
      - name: Test native live-smoke timeout safeguards
        run: python .github/scripts/test_live_agent_smoke.py
      # The Homebrew harness reasons about POSIX Homebrew paths, so `/opt/homebrew` and keg
      # containment are only meaningful on a runner that can reach `brew`.
      - name: Test native Homebrew acceptance-harness safeguards
        if: runner.os == 'macOS'
        run: python3 -B .github/scripts/test_homebrew_acceptance.py
      - name: Test native Chocolatey acceptance-harness safeguards
        run: python -B .github/scripts/test_chocolatey_acceptance.py
      - name: Build both executables
        run: cargo build --locked --target "${{ matrix.target }}" --bins
      - name: Run target tests and executable smoke suite
        run: cargo test --locked --target "${{ matrix.target }}" --all-features

  shell-completions-macos:
    name: shell-completions-macos
    runs-on: macos-15
    timeout-minutes: 30
    env:
      EXPECTED_BASH_VERSION: "5.3.15"
      EXPECTED_FISH_VERSION: "4.8.1"
      EXPECTED_ZSH_VERSION: "5.9.2"
      HOMEBREW_BREW_REVISION: "3c9f3fd075ddcb2f6b1f5efaa2906e2f9ef6441d"
      HOMEBREW_CORE_REVISION: "56c6e019582b3f324c7db4e4ddac1d9a39539e35"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Provision pinned native shells
        run: |
          brew_repository="$(brew --repository)"
          git -C "$brew_repository" fetch --depth=1 origin "$HOMEBREW_BREW_REVISION"
          git -C "$brew_repository" checkout --detach "$HOMEBREW_BREW_REVISION"
          brew tap --force homebrew/core
          core="$(brew --repository homebrew/core)"
          git -C "$core" fetch --depth=1 origin "$HOMEBREW_CORE_REVISION"
          git -C "$core" checkout --detach "$HOMEBREW_CORE_REVISION"
          brew install bash zsh fish
          test "$("$(brew --prefix bash)/bin/bash" -c 'printf %s "$BASH_VERSION"' | cut -d '(' -f 1)" = "$EXPECTED_BASH_VERSION"
          test "$("$(brew --prefix zsh)/bin/zsh" -fc 'printf %s "$ZSH_VERSION"')" = "$EXPECTED_ZSH_VERSION"
          test "$("$(brew --prefix fish)/bin/fish" -c 'printf %s "$version"')" = "$EXPECTED_FISH_VERSION"
          printf '%s\n' \
            "$(brew --prefix bash)/bin" \
            "$(brew --prefix zsh)/bin" \
            "$(brew --prefix fish)/bin" >> "$GITHUB_PATH"
      - name: Build optimized executables
        run: cargo build --locked --release --bins
      - name: Record optimized executable sizes
        run: wc -c target/release/asm target/release/skillmount
      - name: Test acceptance-harness safeguards
        run: python3 .github/scripts/test_shell_completion_acceptance.py
      - name: Exercise Bash, Zsh, and Fish completions
        run: >-
          python3 .github/scripts/shell_completion_acceptance.py
          --asm target/release/asm
          --skillmount target/release/skillmount
          --target aarch64-apple-darwin
          --shell bash
          --shell zsh
          --shell fish
      - name: Exercise system Bash completions
        run: >-
          env PATH="/bin:/usr/bin" "$(command -v python3)"
          .github/scripts/shell_completion_acceptance.py
          --asm target/release/asm
          --skillmount target/release/skillmount
          --target aarch64-apple-darwin
          --shell bash

  shell-completions-windows:
    name: shell-completions-windows (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - i686-pc-windows-msvc
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust target
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" "${{ matrix.target }}"
      - name: Build optimized executables
        run: cargo build --locked --release --target "${{ matrix.target }}" --bins
      - name: Record optimized executable sizes
        run: >-
          Get-Item
          "target/${{ matrix.target }}/release/asm.exe",
          "target/${{ matrix.target }}/release/skillmount.exe"
          | ForEach-Object { "$($_.Name) $($_.Length)" }
      - name: Test acceptance-harness safeguards
        run: python .github/scripts/test_shell_completion_acceptance.py
      - name: Exercise native PowerShell completions
        run: >-
          python .github/scripts/shell_completion_acceptance.py
          --asm "target/${{ matrix.target }}/release/asm.exe"
          --skillmount "target/${{ matrix.target }}/release/skillmount.exe"
          --target "${{ matrix.target }}"
          --shell powershell

  package-homebrew-macos:
    name: package-homebrew-macos
    needs: branch-policy
    if: needs.branch-policy.outputs.package-acceptance == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      # The harness compiles both binaries once and packages the same deterministic release
      # archive the Formulae consume, without requiring an external tap or published v0.2.0.
      SKILLMOUNT_HOMEBREW_ACCEPTANCE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Provision Fish so every advertised completion parses in its real shell
        # Bash and Zsh ship with macOS; Fish does not. Without it the harness records an honest
        # "unavailable" note instead of proving the Fish script parses, which leaves an evidence
        # gap the homebrew-distribution spec does not allow.
        run: brew install --formula fish
      - name: Test acceptance-harness safeguards
        run: python3 -B .github/scripts/test_homebrew_acceptance.py
      - name: Report spec coverage
        run: python3 -B .github/scripts/homebrew_acceptance.py --print-coverage
      - name: Exercise the isolated paired Formula lifecycle
        env:
          REPORT_FILE: ${{ runner.temp }}/homebrew-acceptance.json
        run: >-
          python3 -B .github/scripts/homebrew_acceptance.py
          --report "$REPORT_FILE"
      - name: Upload Homebrew acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-acceptance-report
          path: ${{ runner.temp }}/homebrew-acceptance.json
          if-no-files-found: warn
          retention-days: 7

  package-chocolatey-windows:
    name: package-chocolatey-windows
    needs: branch-policy
    if: needs.branch-policy.outputs.package-acceptance == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      # The harness builds both Windows archives locally and serves them over file:// URLs, so it
      # proves the complete selected-only lifecycle without a published v0.2.0.
      SKILLMOUNT_CHOCOLATEY_ACCEPTANCE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install pinned Rust toolchain and both Windows targets
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" x86_64-pc-windows-msvc
          rustup target add --toolchain "$RUST_TOOLCHAIN" i686-pc-windows-msvc
      - name: Test acceptance-harness safeguards
        run: python -B .github/scripts/test_chocolatey_acceptance.py
      - name: Build both product executables for both architectures
        shell: bash
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc --bin asm --bin skillmount
          cargo build --locked --release --target i686-pc-windows-msvc --bin asm --bin skillmount
      - name: Exercise both package lifecycles under x64 and x86 selection
        env:
          BINARY_DIRECTORY_X64: ${{ github.workspace }}/target/x86_64-pc-windows-msvc/release
          BINARY_DIRECTORY_X86: ${{ github.workspace }}/target/i686-pc-windows-msvc/release
          REPORT_FILE: ${{ runner.temp }}/chocolatey-acceptance.json
        run: >-
          python -B .github/scripts/chocolatey_acceptance.py
          --binary-directory-x64 "$env:BINARY_DIRECTORY_X64"
          --binary-directory-x86 "$env:BINARY_DIRECTORY_X86"
          --report "$env:REPORT_FILE"
      - name: Upload Chocolatey acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chocolatey-acceptance-report
          path: ${{ runner.temp }}/chocolatey-acceptance.json
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: gate
    if: ${{ always() }}
    needs:
      - branch-policy
      - quality
      - test
      - shell-completions-macos
      - shell-completions-windows
      - package-homebrew-macos
      - package-chocolatey-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI predecessor to succeed
        env:
          PACKAGE_ACCEPTANCE: ${{ needs.branch-policy.outputs.package-acceptance }}
          BRANCH_POLICY_RESULT: ${{ needs.branch-policy.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SHELL_COMPLETIONS_MACOS_RESULT: ${{ needs.shell-completions-macos.result }}
          SHELL_COMPLETIONS_WINDOWS_RESULT: ${{ needs.shell-completions-windows.result }}
          PACKAGE_HOMEBREW_MACOS_RESULT: ${{ needs.package-homebrew-macos.result }}
          PACKAGE_CHOCOLATEY_WINDOWS_RESULT: ${{ needs.package-chocolatey-windows.result }}
        run: |
          case "$PACKAGE_ACCEPTANCE" in
            true | false) ;;
            *)
              echo "::error::Unrecognized package-acceptance classification '$PACKAGE_ACCEPTANCE'; refusing to assume the acceptance jobs were excluded."
              exit 1
              ;;
          esac
          # An excluded acceptance job reports 'skipped'. That is the only tolerated non-success
          # result, and only while the classification excludes it, so a condition that stops
          # acceptance from running on a promotion still fails this gate.
          package_failed=""
          for result in "$PACKAGE_HOMEBREW_MACOS_RESULT" "$PACKAGE_CHOCOLATEY_WINDOWS_RESULT"; do
            case "$result" in
              success) ;;
              skipped)
                if [[ "$PACKAGE_ACCEPTANCE" != "false" ]]; then
                  package_failed=1
                fi
                ;;
              *) package_failed=1 ;;
            esac
          done
          if [[ -n "$package_failed" || \
                "$BRANCH_POLICY_RESULT" != "success" || \
                "$QUALITY_RESULT" != "success" || \
                "$TEST_RESULT" != "success" || \
                "$SHELL_COMPLETIONS_MACOS_RESULT" != "success" || \
                "$SHELL_COMPLETIONS_WINDOWS_RESULT" != "success" ]]; then
            echo "::error::Required job results: branch-policy=$BRANCH_POLICY_RESULT quality=$QUALITY_RESULT test=$TEST_RESULT shell-completions-macos=$SHELL_COMPLETIONS_MACOS_RESULT shell-completions-windows=$SHELL_COMPLETIONS_WINDOWS_RESULT package-homebrew-macos=$PACKAGE_HOMEBREW_MACOS_RESULT package-chocolatey-windows=$PACKAGE_CHOCOLATEY_WINDOWS_RESULT package-acceptance=$PACKAGE_ACCEPTANCE"
            exit 1
          fi
          echo "All required CI jobs succeeded."
