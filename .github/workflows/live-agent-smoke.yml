name: Live agent smoke

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native runner group to exercise
        required: true
        default: all
        type: choice
        options:
          - all
          - macos-arm64
          - windows
      include_omp:
        description: >-
          Also exercise the opt-in OMP case. OMP 17.2.9 publishes no SHA256SUMS.txt, so its release
          asset is recorded by observed sha256 instead of being integrity-locked, and it publishes
          no 32-bit asset, so the Windows x86 leg reports the case as unknown.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  macos-arm64:
    name: macOS arm64 / symlink
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos-arm64' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch integrity-locked native agents
        run: >-
          python3 .github/scripts/prepare_live_agents.py
          --platform macos-arm64
          --output-dir "${{ runner.temp }}/live-agents"
      - name: Fetch the opt-in OMP release asset
        if: ${{ inputs.include_omp }}
        env:
          OMP_TAG: v17.2.9
          OMP_ASSET: omp-darwin-arm64
        run: |
          # Unlike the npm-packaged agents, this tag has no published SHA256SUMS.txt, so there is no
          # digest to lock against: the smoke records the sha256 it observes as evidence instead.
          mkdir -p "${{ runner.temp }}/live-agents/omp"
          curl -fsSL --retry 3 --retry-connrefused \
            -o "${{ runner.temp }}/live-agents/omp/omp" \
            "https://github.com/can1357/oh-my-pi/releases/download/$OMP_TAG/$OMP_ASSET"
          chmod +x "${{ runner.temp }}/live-agents/omp/omp"
      - name: Build native SkillMount
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          cargo build --locked --bin asm
      - name: Run real-agent discovery smoke
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >-
          python3 .github/scripts/live_agent_smoke.py
          --asm target/debug/asm
          --link-mode symlink
          --wrapper-target aarch64-apple-darwin
          --codex-bin "${{ runner.temp }}/live-agents/codex/bin/codex"
          --claude-bin "${{ runner.temp }}/live-agents/claude/claude"
          --agent-manifest "${{ runner.temp }}/live-agents/manifest.json"
          --evidence-dir "${{ runner.temp }}/live-agent-evidence"
          ${{ inputs.include_omp && format('--omp-bin "{0}/live-agents/omp/omp"', runner.temp) || '' }}
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-agent-macos-arm64-symlink
          path: ${{ runner.temp }}/live-agent-evidence
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }} / junction
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch integrity-locked native agents
        shell: pwsh
        run: |
          python .github/scripts/prepare_live_agents.py `
            --platform windows-x64 `
            --output-dir "$env:RUNNER_TEMP/live-agents"
      - name: Fetch the opt-in OMP release asset
        if: ${{ inputs.include_omp && matrix.arch == 'x64' }}
        shell: pwsh
        env:
          OMP_TAG: v17.2.9
          OMP_ASSET: omp-windows-x64.exe
        run: |
          # 17.2.9 ships no 32-bit OMP asset, so only this x64 leg can select the case, and the tag
          # has no published SHA256SUMS.txt to lock the download against; the smoke records the
          # sha256 it observes as evidence instead.
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/live-agents/omp" | Out-Null
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -MaximumRetryCount 3 -RetryIntervalSec 5 `
            -Uri "https://github.com/can1357/oh-my-pi/releases/download/$env:OMP_TAG/$env:OMP_ASSET" `
            -OutFile "$env:RUNNER_TEMP/live-agents/omp/omp.exe"
      - name: Build native SkillMount target
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" "${{ matrix.target }}"
          cargo build --locked --target "${{ matrix.target }}" --bin asm
      - name: Run real-agent discovery smoke
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >-
          python .github/scripts/live_agent_smoke.py
          --asm "target/${{ matrix.target }}/debug/asm.exe"
          --link-mode junction
          --wrapper-target "${{ matrix.target }}"
          --codex-bin "${{ runner.temp }}/live-agents/codex/bin/codex.exe"
          --claude-bin "${{ runner.temp }}/live-agents/claude/claude.exe"
          --agent-manifest "${{ runner.temp }}/live-agents/manifest.json"
          --evidence-dir "${{ runner.temp }}/live-agent-evidence"
          ${{ inputs.include_omp && matrix.arch == 'x64' && format('--omp-bin "{0}/live-agents/omp/omp.exe"', runner.temp) || '' }}
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-agent-windows-${{ matrix.arch }}-junction
          path: ${{ runner.temp }}/live-agent-evidence
          if-no-files-found: error
