name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to build without publishing
        required: true
        default: main
        type: string

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.1"
  SKILLMOUNT_REQUIRE_LINKS: "1"

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
      commit: ${{ steps.validate.outputs.commit }}
      publish: ${{ steps.validate.outputs.publish }}
      matrix: ${{ steps.validate.outputs.matrix }}
    steps:
      - name: Check out selected release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate version and release provenance
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          SELECTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
        run: >-
          python -B .github/scripts/release.py preflight
          --event-name "$EVENT_NAME"
          --ref-name "$SELECTED_REF"
          --event-sha "$EVENT_SHA"
          --github-output "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Rust toolchain and target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" "$TARGET"
      - name: Verify runner and compiler architecture
        shell: bash
        env:
          EXPECTED_HOST: ${{ matrix.host }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
          TARGET: ${{ matrix.target }}
        run: >-
          python -B .github/scripts/release.py verify-runner
          --toolchain "$RUST_TOOLCHAIN"
          --runner-arch "$RUNNER_ARCH"
          --expected-runner-arch "$EXPECTED_RUNNER_ARCH"
          --expected-host "$EXPECTED_HOST"
          --target "$TARGET"
      - name: Test the native target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +"$RUST_TOOLCHAIN" test --locked --target "$TARGET" --all-features
      - name: Build optimized product binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          cargo +"$RUST_TOOLCHAIN" build --locked --release --target "$TARGET"
          --bin asm --bin skillmount
      - name: Smoke-check both executable names
        shell: bash
        env:
          BINARY_DIRECTORY: ${{ github.workspace }}/target/${{ matrix.target }}/release
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: >-
          python -B .github/scripts/release.py smoke
          --binary-directory "$BINARY_DIRECTORY"
          --target "$TARGET"
          --version "$VERSION"
      - name: Build and reinspect deterministic package
        shell: bash
        env:
          BINARY_DIRECTORY: ${{ github.workspace }}/target/${{ matrix.target }}/release
          COMMIT: ${{ needs.preflight.outputs.commit }}
          OUTPUT_DIRECTORY: ${{ runner.temp }}/release-package
          TAG: ${{ needs.preflight.outputs.tag }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: >-
          python -B .github/scripts/release.py package
          --binary-directory "$BINARY_DIRECTORY"
          --output-directory "$OUTPUT_DIRECTORY"
          --target "$TARGET"
          --version "$VERSION"
          --tag "$TAG"
          --commit "$COMMIT"
      - name: Upload target-named workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package-${{ matrix.target }}
          path: ${{ runner.temp }}/release-package/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  aggregate:
    name: aggregate
    needs:
      - preflight
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download all target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-package-*
          path: ${{ runner.temp }}/release-input
          merge-multiple: true
          digest-mismatch: error
      - name: Require and verify the complete archive set
        env:
          COMMIT: ${{ needs.preflight.outputs.commit }}
          INPUT_DIRECTORY: ${{ runner.temp }}/release-input
          OUTPUT_DIRECTORY: ${{ runner.temp }}/release-verified
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: >-
          python -B .github/scripts/release.py aggregate
          --input-directory "$INPUT_DIRECTORY"
          --output-directory "$OUTPUT_DIRECTORY"
          --version "$VERSION"
          --tag "$TAG"
          --commit "$COMMIT"
      - name: Upload verified release asset set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-assets
          path: ${{ runner.temp }}/release-verified/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: publish
    needs:
      - preflight
      - build
      - aggregate
    if: >-
      ${{
        needs.preflight.result == 'success' &&
        needs.build.result == 'success' &&
        needs.aggregate.result == 'success' &&
        needs.preflight.outputs.publish == 'true' &&
        github.event_name == 'push' &&
        github.ref == format('refs/tags/{0}', needs.preflight.outputs.tag)
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.preflight.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Check out validated publication code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-assets
          path: ${{ runner.temp }}/release-publish
          digest-mismatch: error
      - name: Reverify publication boundary
        env:
          ASSETS_DIRECTORY: ${{ runner.temp }}/release-publish
          COMMIT: ${{ needs.preflight.outputs.commit }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: >-
          python -B .github/scripts/release.py verify-set
          --directory "$ASSETS_DIRECTORY"
          --version "$VERSION"
          --tag "$TAG"
          --commit "$COMMIT"
      - name: Create or resume and publish verified release
        env:
          ASSETS_DIRECTORY: ${{ runner.temp }}/release-publish
          COMMIT: ${{ needs.preflight.outputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          gh --version
          python -B .github/scripts/release_publish.py \
            --repo "$RELEASE_REPOSITORY" \
            --assets-directory "$ASSETS_DIRECTORY" \
            --version "$VERSION" \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --run-url "$RUN_URL"
