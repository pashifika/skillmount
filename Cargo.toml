[package]
name = "skillmount"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Portable skill mounting for coding agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pashifika/skillmount"

[[bin]]
name = "asm"
path = "src/bin/asm.rs"

[[bin]]
name = "skillmount"
path = "src/bin/skillmount.rs"

[[bin]]
name = "skillmount-fake-agent"
path = "tests/fixtures/fake_agent.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "skillmount-supervisor-harness"
path = "tests/fixtures/supervisor_harness.rs"
required-features = ["test-fixtures"]

[features]
test-fixtures = ["dep:ctrlc", "signal-hook/iterator"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
missing_docs = "deny"
# `deny` rather than `forbid`: the platform link backends and native process dispatch/containment
# need narrow raw calls that no safe API exposes, and `forbid` cannot be lifted anywhere. Every
# `allow` is a whole audited FFI module, and no other module may opt in. See ADR 0011 and ADR 0019.
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"

[dependencies]
clap = { version = "=4.6.5", features = ["derive"] }
# Real operating-system advisory locks. `flock` and `LockFileEx` are the liveness signal the
# transaction layer needs, and neither is reachable from the standard library. `fs4` wraps exactly
# those two calls, keeps locking-related unsafe within the two audited link FFI modules (ADR 0011),
# and already resolves to the `windows-sys` version pinned below.
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
serde_yaml_ng = "=0.10.0"
# Lock filenames are SHA-256 digests of tagged identity bytes, so two spellings of one resource
# reach the same file. Only `alloc`-free digesting is used.
sha2 = { version = "=0.11.0", default-features = false }

# Placement needs an atomic no-replace rename, which `std::fs::rename` does not provide: it
# replaces. macOS reaches `renameatx_np(RENAME_EXCL)` and other Unix hosts reach
# `renameat2(RENAME_NOREPLACE)`, both only through libc.
[target."cfg(unix)".dependencies]
libc = "=0.2.189"
# Product handlers record event identity directly in an atomic ledger through the audited Unix FFI
# boundary. Only the feature-gated fake agent uses signal-hook's iterator support.
signal-hook = { version = "=0.4.4", default-features = false }
# `kill`/`killpg` are exposed through a maintained safe API, keeping raw Unix process FFI out of
# the process supervisor.
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }

# Junctions are reparse points. Creating, reading, and identifying one needs `DeviceIoControl`,
# `CreateFileW`, and `GetFileInformationByHandle`, none of which the standard library exposes.
[target."cfg(windows)".dependencies]
# The fake-agent fixture uses `ctrlc` to observe its inherited console events. Product supervision
# preserves the raw event type through the audited process FFI module instead.
ctrlc = { version = "=3.5.2", optional = true }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
