name: Live agent smoke

on:
  pull_request:
    branches:
      - main
      - "dev/**"
  workflow_dispatch:
    inputs:
      platform:
        description: Native runner group to exercise
        required: true
        default: all
        type: choice
        options:
          - all
          - macos-arm64
          - windows
      include_omp:
        description: >-
          Also exercise authenticated OMP discovery in manual runs; diagnostic probes always
          receive OMP. OMP 18.14.0 is verified against a committed
          SHA-256 from its published SHA256SUMS.txt. Both Windows wrapper architectures
          launch the native x64 agent on the x64 runner; no 32-bit OMP build is claimed.
        required: false
        default: false
        type: boolean

      probes_only:
        description: Version/help/doctor only, without credentials; not Skill discovery
        required: false
        default: false
        type: boolean

# PR runs only credential-free probes. Authenticated discovery is an explicit manual action.
permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  macos-arm64:
    name: macOS arm64 / symlink
    if: ${{ github.event_name == 'pull_request' || inputs.platform == 'all' || inputs.platform == 'macos-arm64' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch integrity-locked native agents
        run: >-
          python3 .github/scripts/prepare_live_agents.py
          --platform macos-arm64
          --output-dir "${{ runner.temp }}/live-agents"
      - name: Fetch the integrity-locked OMP diagnostic binary
        env:
          OMP_TAG: v18.14.0
          OMP_ASSET: omp-darwin-arm64
        run: |
          # SHA-256 reviewed from the published v18.14.0 SHA256SUMS.txt.
          mkdir -p "${{ runner.temp }}/live-agents/omp"
          curl -fsSL --retry 3 --retry-connrefused \
            -o "${{ runner.temp }}/live-agents/omp/omp" \
            "https://github.com/can1357/oh-my-pi/releases/download/$OMP_TAG/$OMP_ASSET"
          echo "608843959ab34295d52460dd09dd7d548b6c903c08a83c67954c2d4c36fd1f5a  ${{ runner.temp }}/live-agents/omp/omp" | shasum -a 256 -c -
          chmod +x "${{ runner.temp }}/live-agents/omp/omp"
      - name: Build native SkillMount
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          cargo build --locked --bin asm
      - name: Run real-agent discovery smoke
        env:
          CODEX_API_KEY: ${{ github.event_name == 'workflow_dispatch' && !inputs.probes_only && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ github.event_name == 'workflow_dispatch' && !inputs.probes_only && secrets.ANTHROPIC_API_KEY || '' }}
        run: >-
          python3 .github/scripts/live_agent_smoke.py
          --asm target/debug/asm
          --link-mode symlink
          --wrapper-target aarch64-apple-darwin
          --codex-bin "${{ runner.temp }}/live-agents/codex/bin/codex"
          --claude-bin "${{ runner.temp }}/live-agents/claude/claude"
          --agent-manifest "${{ runner.temp }}/live-agents/manifest.json"
          --evidence-dir "${{ runner.temp }}/live-agent-evidence"
          ${{ (github.event_name == 'pull_request' || inputs.probes_only) && '--probes-only' || '' }}
          ${{ (github.event_name == 'pull_request' || inputs.include_omp) && format('--omp-bin "{0}/live-agents/omp/omp"', runner.temp) || format('--omp-probe-bin "{0}/live-agents/omp/omp"', runner.temp) }}
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-agent-macos-arm64-symlink
          path: ${{ runner.temp }}/live-agent-evidence
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }} / junction
    if: ${{ github.event_name == 'pull_request' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch integrity-locked native agents
        shell: pwsh
        run: |
          python .github/scripts/prepare_live_agents.py `
            --platform windows-x64 `
            --output-dir "$env:RUNNER_TEMP/live-agents"
      - name: Fetch the integrity-locked OMP diagnostic binary
        shell: pwsh
        env:
          OMP_TAG: v18.14.0
          OMP_ASSET: omp-windows-x64.exe
        run: |
          # Both x64 and x86 wrappers launch this x64 child on the x64 Windows host.
          # SHA-256 is from the published v18.14.0 SHA256SUMS.txt.
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/live-agents/omp" | Out-Null
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -MaximumRetryCount 3 -RetryIntervalSec 5 `
            -Uri "https://github.com/can1357/oh-my-pi/releases/download/$env:OMP_TAG/$env:OMP_ASSET" `
            -OutFile "$env:RUNNER_TEMP/live-agents/omp/omp.exe"
          $digest = (Get-FileHash "$env:RUNNER_TEMP/live-agents/omp/omp.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne "620a5935cdb6a9ed52d8b0c93892d6b5bb84155244a98f3be82af0455177bf29") { throw "OMP SHA-256 mismatch" }
      - name: Build native SkillMount target
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" "${{ matrix.target }}"
          cargo build --locked --target "${{ matrix.target }}" --bin asm
      - name: Run real-agent discovery smoke
        env:
          CODEX_API_KEY: ${{ github.event_name == 'workflow_dispatch' && !inputs.probes_only && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ github.event_name == 'workflow_dispatch' && !inputs.probes_only && secrets.ANTHROPIC_API_KEY || '' }}
        run: >-
          python .github/scripts/live_agent_smoke.py
          --asm "target/${{ matrix.target }}/debug/asm.exe"
          --link-mode junction
          --wrapper-target "${{ matrix.target }}"
          --codex-bin "${{ runner.temp }}/live-agents/codex/bin/codex.exe"
          --claude-bin "${{ runner.temp }}/live-agents/claude/claude.exe"
          --agent-manifest "${{ runner.temp }}/live-agents/manifest.json"
          --evidence-dir "${{ runner.temp }}/live-agent-evidence"
          ${{ (github.event_name == 'pull_request' || inputs.probes_only) && '--probes-only' || '' }}
          ${{ (github.event_name == 'pull_request' || inputs.include_omp) && format('--omp-bin "{0}/live-agents/omp/omp.exe"', runner.temp) || format('--omp-probe-bin "{0}/live-agents/omp/omp.exe"', runner.temp) }}
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-agent-windows-${{ matrix.arch }}-junction
          path: ${{ runner.temp }}/live-agent-evidence
          if-no-files-found: error
